<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="체크리스트">
<title>체크리스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   ★ 설정 — Firebase 콘솔에서 복사한 값을 아래에 붙여 넣으세요.
   (프로젝트 설정 → 일반 → 내 앱 → SDK 설정 및 구성 → "구성")
   apiKey를 비워 두면 이 기기에만 저장되는 모드로 동작합니다.
   ============================================================ */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyBkVtKczDgi3XMayvyz951JRfAJjYxmRQA",
  authDomain: "check-c4410.firebaseapp.com",
  projectId: "check-c4410",
  storageBucket: "check-c4410.firebasestorage.app",
  messagingSenderId: "153644201090",
  appId: "1:153644201090:web:01a33690e0800d5360709b"
};
/* 목록 ID — 이 값이 곧 "내 목록의 비밀 주소"입니다. 남에게 알려주지 마세요.
   바꾸고 싶으면 아무 영문·숫자 조합으로 바꿔도 됩니다. */
var LIST_ID = "34gzgnl7yxo-XOEb";
</script>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
/* Layout: white ground, hairline dividers, black pill buttons, tight bold type. One column, max 640px. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --fg: #222222;
  --muted: #8a8a8a;
  --faint: #bdbdbd;
  --line: #ebebeb;
  --line-strong: #222222;
  --accent: #222222;
  --accent-ink: #ffffff;
  --soft: #f4f4f4;
  --up: #ef6253;     /* late */
  --down: #41b979;   /* today */
  --blue: #1e5cd6;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --surface: #111111; --fg: #ebebeb; --muted: #8f8f8f; --faint: #5a5a5a;
    --line: #2a2a2a; --line-strong: #ebebeb; --accent: #ebebeb; --accent-ink: #111111; --soft: #1e1e1e;
    --up: #f27b6e; --down: #52c98a; --blue: #6a9cff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --surface: #111111; --fg: #ebebeb; --muted: #8f8f8f; --faint: #5a5a5a;
  --line: #2a2a2a; --line-strong: #ebebeb; --accent: #ebebeb; --accent-ink: #111111; --soft: #1e1e1e;
  --up: #f27b6e; --down: #52c98a; --blue: #6a9cff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 15px; line-height: 1.5; letter-spacing: -0.01em;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 80px;
}

/* top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 18px 0;
}
.titlerow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.03em; }
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.count b { color: var(--fg); font-weight: 700; }

.addrow {
  display: flex; gap: 8px; align-items: center;
  border-bottom: 2px solid var(--line-strong); padding: 10px 0 10px; margin-top: 14px;
}
#newText {
  flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg);
  font: inherit; font-size: 16px; font-weight: 500; padding: 6px 0; outline: none; letter-spacing: -0.01em;
}
#newText::placeholder { color: var(--faint); font-weight: 400; }
.datebtn {
  position: relative; flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  border-radius: 999px; height: 32px; padding: 0 12px; font: inherit; font-size: 12px; cursor: pointer;
  display: inline-flex; align-items: center; white-space: nowrap; letter-spacing: 0;
}
.datebtn.set { color: var(--fg); border-color: var(--line-strong); font-weight: 500; }
.datebtn input[type="date"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.addbtn {
  flex: 0 0 auto; border: 0; background: var(--accent); color: var(--accent-ink);
  border-radius: 999px; height: 32px; padding: 0 16px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
}
.tabs { display: flex; gap: 20px; margin-top: 2px; }
.tab {
  border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 500;
  padding: 10px 0 9px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab.on { color: var(--fg); font-weight: 700; border-bottom-color: var(--line-strong); }
.addbtn:focus-visible, .datebtn:focus-visible, .check:focus-visible, .tab:focus-visible, .btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* list */
ul.list { list-style: none; margin: 0; padding: 0; }
li.item { display: flex; align-items: flex-start; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.check {
  flex: 0 0 auto; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; border: 1px solid var(--faint);
  background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0;
}
.check svg { width: 12px; height: 12px; opacity: 0; stroke: var(--accent-ink); }
li.done .check { background: var(--accent); border-color: var(--accent); }
li.done .check svg { opacity: 1; }
.body { flex: 1; min-width: 0; cursor: text; }
.text { font-weight: 500; overflow-wrap: anywhere; }
.text.c-red { color: var(--up); font-weight: 700; }
.text.c-blue { color: var(--blue); font-weight: 700; }
.swatches { display: inline-flex; gap: 8px; align-items: center; margin-right: 4px; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; padding: 0; position: relative; }
.sw.red { background: var(--up); border-color: var(--up); }
.sw.blue { background: var(--blue); border-color: var(--blue); }
.sw.on::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--fg); }
li.done .text { color: var(--faint); font-weight: 400; text-decoration: line-through; text-decoration-thickness: 1px; }
.due { display: inline-block; margin-top: 6px; font-size: 11px; line-height: 1; letter-spacing: 0; padding: 5px 8px; border-radius: 3px; background: var(--soft); color: var(--muted); font-variant-numeric: tabular-nums; }
.due.today { background: var(--down); color: #fff; font-weight: 700; }
.due.late { background: var(--up); color: #fff; font-weight: 700; }
li.done .due { background: var(--soft); color: var(--faint); font-weight: 400; }

/* inline editor */
li.editing .body { display: none; }
.editor { flex: 1; min-width: 0; display: none; flex-direction: column; gap: 10px; }
li.editing .editor { display: flex; }
.editor input[type="text"] {
  width: 100%; border: 0; border-bottom: 2px solid var(--line-strong); background: transparent; color: var(--fg);
  font: inherit; font-size: 16px; font-weight: 500; padding: 4px 0 8px; outline: none; border-radius: 0;
}
.editrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.editrow .spacer { flex: 1; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 12px; font-weight: 500;
  border-radius: 999px; height: 32px; padding: 0 14px; cursor: pointer; letter-spacing: 0;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.danger { color: var(--up); border-color: var(--line); }
.btn.quiet { border-color: transparent; color: var(--muted); padding: 0 6px; }

.empty { text-align: center; color: var(--muted); padding: 64px 12px; font-size: 13px; letter-spacing: 0; }
.empty b { display: block; color: var(--fg); font-weight: 700; font-size: 15px; margin-bottom: 6px; letter-spacing: -0.02em; }
footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; font-size: 11px; color: var(--muted); letter-spacing: 0; }
footer .status { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) {
  .check { transition: background .12s, border-color .12s; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="titlerow">
      <h1>체크리스트</h1>
      <div class="count" id="count"></div>
    </div>
    <form class="addrow" id="addForm">
      <input id="newText" type="text" placeholder="할 일을 적고 Enter" autocomplete="off" enterkeyhint="done">
      <label class="datebtn" id="newDateBtn" title="마감일 (선택)">
        <span id="newDateLabel">날짜</span>
        <input type="date" id="newDate">
      </label>
      <button type="submit" class="addbtn">추가</button>
    </form>
    <div class="tabs" role="tablist">
      <button class="tab on" type="button" data-filter="all" id="tabAll">전체</button>
      <button class="tab" type="button" data-filter="open" id="tabOpen">진행 중</button>
      <button class="tab" type="button" data-filter="done" id="tabDone">완료</button>
    </div>
  </div>

  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" hidden><b>항목이 없습니다</b>위 칸에 할 일을 적고 Enter를 누르세요.</div>

  <footer>
    <span class="status" id="status">불러오는 중…</span>
    <button class="btn quiet" id="clearDone" hidden>완료 항목 지우기</button>
  </footer>
</div>

<script>
(function () {
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var countEl = document.getElementById('count');
  var statusEl = document.getElementById('status');
  var clearBtn = document.getElementById('clearDone');
  var form = document.getElementById('addForm');
  var newText = document.getElementById('newText');
  var newDate = document.getElementById('newDate');
  var newDateLabel = document.getElementById('newDateLabel');
  var newDateBtn = document.getElementById('newDateBtn');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));

  var items = {};          // id -> {text, done, due, order, createdAt}
  var editingId = null;
  var filter = 'all';
  var store = null;        // 'db' | 'local'
  var db = null;
  var LS_KEY = 'checklist-items-v1';
  var LS_FILTER = 'checklist-filter';

  try { var f = localStorage.getItem(LS_FILTER); if (f === 'open' || f === 'done') filter = f; } catch (e) {}

  // ---------- helpers ----------
  function uid() { return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function todayStr() {
    var d = new Date(); var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }
  function dayDiff(due) {
    if (!due) return null;
    var p = due.split('-').map(Number);
    var a = new Date(p[0], p[1] - 1, p[2]);
    var t = new Date(); var b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    return Math.round((a - b) / 86400000);
  }
  function dueLabel(due) {
    var n = dayDiff(due); if (n === null) return { text: '', cls: '' };
    var p = due.split('-'); var md = Number(p[1]) + '/' + Number(p[2]);
    if (n === 0) return { text: '오늘', cls: 'today' };
    if (n === 1) return { text: '내일 ' + md, cls: '' };
    if (n < 0) return { text: md + ' · ' + (-n) + '일 지남', cls: 'late' };
    if (n <= 7) return { text: 'D-' + n + ' · ' + md, cls: '' };
    return { text: md, cls: '' };
  }
  function sorted() {
    return Object.keys(items).map(function (k) { return Object.assign({ id: k }, items[k]); })
      .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  }
  function nextOrder() {
    var max = 0; Object.keys(items).forEach(function (k) { max = Math.max(max, items[k].order || 0); });
    return max + 1;
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e;
  }

  // ---------- persistence ----------
  function saveItem(id, data) {
    items[id] = data;
    render();
    if (store === 'db') {
      db.collection('items').doc(id).set(data).catch(function (e) { setStatus('저장 실패: ' + e.code); });
    } else { saveLocal(); }
  }
  function removeItem(id) {
    delete items[id];
    render();
    if (store === 'db') {
      db.collection('items').doc(id).delete().catch(function (e) { setStatus('삭제 실패: ' + e.code); });
    } else { saveLocal(); }
  }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch (e) {} }
  function loadLocal() {
    try { var raw = localStorage.getItem(LS_KEY); if (raw) items = JSON.parse(raw) || {}; } catch (e) { items = {}; }
  }
  function setStatus(t) { statusEl.textContent = t; }

  // ---------- render ----------
  function render() {
    var all = sorted();
    var rows = all.filter(function (r) {
      if (filter === 'open') return !r.done;
      if (filter === 'done') return r.done;
      return true;
    });
    listEl.textContent = '';
    rows.forEach(function (it) {
      var li = el('li', 'item' + (it.done ? ' done' : '') + (editingId === it.id ? ' editing' : ''));
      li.dataset.id = it.id;

      var chk = el('button', 'check'); chk.type = 'button'; chk.setAttribute('aria-label', it.done ? '완료 취소' : '완료');
      chk.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>';
      chk.addEventListener('click', function () {
        saveItem(it.id, Object.assign({}, items[it.id], { done: !items[it.id].done, doneAt: !items[it.id].done ? Date.now() : null }));
      });
      li.appendChild(chk);

      var body = el('div', 'body');
      body.appendChild(el('div', 'text' + (it.color ? ' c-' + it.color : ''), it.text));
      var dl = dueLabel(it.due);
      if (dl.text) body.appendChild(el('span', 'due ' + dl.cls, dl.text));
      body.addEventListener('click', function () { editingId = it.id; render(); });
      li.appendChild(body);

      // editor
      var ed = el('div', 'editor');
      var ti = document.createElement('input'); ti.type = 'text'; ti.value = it.text; ti.id = 'edit-' + it.id;
      ed.appendChild(ti);
      var er = el('div', 'editrow');
      var color = it.color || '';
      var sws = el('div', 'swatches');
      [['', '기본'], ['red', '빨강'], ['blue', '파랑']].forEach(function (c) {
        var b = el('button', 'sw' + (c[0] ? ' ' + c[0] : '') + (color === c[0] ? ' on' : '')); b.type = 'button'; b.title = c[1]; b.setAttribute('aria-label', c[1]);
        b.addEventListener('click', function () { color = c[0]; Array.prototype.forEach.call(sws.children, function (x) { x.classList.remove('on'); }); b.classList.add('on'); });
        sws.appendChild(b);
      });
      er.appendChild(sws);
      var dlab = el('label', 'datebtn' + (it.due ? ' set' : '')); dlab.appendChild(el('span', null, it.due ? it.due : '날짜 없음'));
      var di = document.createElement('input'); di.type = 'date'; di.value = it.due || ''; di.id = 'date-' + it.id;
      di.addEventListener('change', function () { dlab.firstChild.textContent = di.value || '날짜 없음'; dlab.classList.toggle('set', !!di.value); });
      dlab.appendChild(di); er.appendChild(dlab);
      var clearD = el('button', 'btn quiet', '날짜 지우기'); clearD.type = 'button';
      clearD.addEventListener('click', function () { di.value = ''; dlab.firstChild.textContent = '날짜 없음'; dlab.classList.remove('set'); });
      er.appendChild(clearD);
      er.appendChild(el('span', 'spacer'));
      var del = el('button', 'btn danger', '삭제'); del.type = 'button';
      del.addEventListener('click', function () { editingId = null; removeItem(it.id); });
      er.appendChild(del);
      var cancel = el('button', 'btn', '취소'); cancel.type = 'button';
      cancel.addEventListener('click', function () { editingId = null; render(); });
      er.appendChild(cancel);
      var save = el('button', 'btn primary', '저장'); save.type = 'button';
      function commit() {
        var t = ti.value.trim(); if (!t) { editingId = null; removeItem(it.id); return; }
        editingId = null;
        saveItem(it.id, Object.assign({}, items[it.id], { text: t, due: di.value || '', color: color }));
      }
      save.addEventListener('click', commit);
      ti.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); commit(); } if (e.key === 'Escape') { editingId = null; render(); } });
      er.appendChild(save);
      ed.appendChild(er);
      li.appendChild(ed);

      listEl.appendChild(li);
      if (editingId === it.id) { ti.focus(); ti.setSelectionRange(ti.value.length, ti.value.length); }
    });

    var total = all.length, done = all.filter(function (r) { return r.done; }).length;
    emptyEl.hidden = rows.length > 0;
    countEl.innerHTML = total ? '<b>' + done + '</b> / ' + total + ' 완료' : '';
    clearBtn.hidden = done === 0;
    tabs.forEach(function (t) { t.classList.toggle('on', t.dataset.filter === filter); });
  }

  // ---------- events ----------
  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      filter = t.dataset.filter; editingId = null; render();
      try { localStorage.setItem(LS_FILTER, filter); } catch (e) {}
    });
  });
  newDate.addEventListener('change', function () {
    newDateLabel.textContent = newDate.value || '날짜';
    newDateBtn.classList.toggle('set', !!newDate.value);
  });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var t = newText.value.trim(); if (!t) return;
    var id = uid();
    if (filter === 'done') { filter = 'all'; }
    saveItem(id, { text: t, done: false, due: newDate.value || '', order: nextOrder(), createdAt: Date.now() });
    newText.value = ''; newDate.value = ''; newDateLabel.textContent = '날짜'; newDateBtn.classList.remove('set');
    newText.focus();
  });
  clearBtn.addEventListener('click', function () {
    sorted().filter(function (r) { return r.done; }).forEach(function (r) { removeItem(r.id); });
  });

  var lastDay = todayStr();
  setInterval(function () { var d = todayStr(); if (d !== lastDay) { lastDay = d; render(); } }, 60000);

  // 기기에만 저장돼 있던 항목을 인터넷 저장소로 한 번 옮깁니다.
  var migrated = false;
  function migrateLocal() {
    if (migrated) return; migrated = true;
    var local = {};
    try { var raw = localStorage.getItem(LS_KEY); if (raw) local = JSON.parse(raw) || {}; } catch (e) { return; }
    var ids = Object.keys(local).filter(function (k) { return !items[k] && local[k] && local[k].text; });
    if (!ids.length) { try { localStorage.removeItem(LS_KEY); } catch (e) {} return; }
    var base = nextOrder();
    var writes = ids.map(function (k, i) {
      var d = local[k];
      var data = { text: String(d.text), done: !!d.done, due: d.due || '', order: base + i, createdAt: d.createdAt || Date.now() };
      if (d.color) data.color = d.color;
      items[k] = data;
      return db.collection('items').doc(k).set(data);
    });
    render();
    setStatus('이 기기에 있던 ' + ids.length + '개 항목을 옮기는 중…');
    Promise.all(writes).then(function () {
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      setStatus('PC·모바일 자동 동기화');
    }).catch(function (e) { setStatus('옮기기 실패: ' + (e && e.code ? e.code : e)); });
  }

  // ---------- boot ----------
  render();
  var fbReady = typeof firebase !== 'undefined' && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey;
  if (!fbReady) { bootLocal(); return; }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    var fs = firebase.firestore();
    var col = fs.collection('lists').doc(LIST_ID).collection('items');
    db = { collection: function () { return col; } };
    store = 'db';
    col.onSnapshot({ includeMetadataChanges: true }, function (snap) {
      var next = {};
      snap.forEach(function (d) { next[d.id] = d.data(); });
      items = next;
      render();
      setStatus(snap.metadata.fromCache ? '동기화 중…' : 'PC·모바일 자동 동기화');
      if (!snap.metadata.fromCache) migrateLocal();
    }, function (err) {
      setStatus('연결 실패: ' + (err && err.code ? err.code : err) + ' — 설정값과 보안 규칙을 확인하세요');
    });
  } catch (e) {
    setStatus('Firebase 초기화 실패 — 설정값을 확인하세요');
    bootLocal();
  }

  function bootLocal() {
    store = 'local'; loadLocal(); render();
    setStatus('이 기기에만 저장됨 (Firebase 미설정)');
  }
})();
</script>
</body>
</html>
